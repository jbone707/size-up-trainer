<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Size-Up Trainer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0f1216;
    --panel: #181d24;
    --line: #2b333e;
    --text: #f1f3f5;
    --muted: #9aa5b1;
    --accent: #e4572e;
    --accent-press: #c4441f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  nav { display: flex; gap: 4px; }
  nav a {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px;
    color: var(--muted); text-decoration: none; border-radius: 8px; font-weight: 600;
  }
  nav a:hover { color: var(--text); background: var(--panel); }
  nav a[aria-current="page"] { color: var(--text); box-shadow: inset 0 -3px 0 var(--accent); border-radius: 0; }
  h1 {
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 700;
  }
  .filter { display: flex; align-items: center; gap: 8px; }
  .filter label { color: var(--muted); font-size: 0.9rem; }
  select {
    min-height: 44px;
    padding: 0 12px;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .stage {
    flex: 1;
    min-height: 220px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .stage img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 230px);
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .message {
    color: var(--muted);
    padding: 32px 16px;
    text-align: center;
    max-width: 40ch;
  }
  .credit {
    margin: 0;
    padding: 4px 16px;
    font-size: 0.75rem;
    color: var(--muted);
    min-height: 1.6em;
    overflow-wrap: anywhere;
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 16px 18px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .clock { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .time {
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .day { font-size: clamp(1.2rem, 4vw, 1.7rem); color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  button {
    min-height: 48px;
    min-width: 140px;
    padding: 0 22px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover, button:active { background: var(--accent-press); }
  button:disabled { opacity: 0.5; cursor: default; }
  .steps { display: flex; gap: 8px; }
  .steps button { min-width: 112px; }
  button.random { background: transparent; border: 2px solid var(--accent); }
  button.random:hover, button.random:active { background: var(--accent); }
  :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 0.8rem; padding: 0 16px 12px; background: var(--panel); margin: 0; }
  @media (max-width: 520px) {
    .actions { width: 100%; justify-content: space-between; margin-left: 0; flex-wrap: wrap; gap: 8px; }
    .steps { width: 100%; }
    .steps button { flex: 1; min-width: 0; padding: 0 8px; }
    .stage img { max-height: 55vh; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Size-Up Trainer</h1>
    <nav aria-label="Main">
      <a href="./" aria-current="page">Practice</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </div>
  <div class="filter">
    <label for="type">Scene type</label>
    <select id="type">
      <option value="all">All scenes</option>
      <option value="residential">Residential</option>
      <option value="multi-family">Multi-family</option>
      <option value="commercial">Commercial</option>
      <option value="high-rise">High-rise</option>
      <option value="vegetation">Vegetation</option>
      <option value="vehicle">Vehicle and other</option>
    </select>
  </div>
</header>

<main>
  <div class="stage" id="stage">
    <img id="photo" alt="" hidden>
    <p class="message" id="message" role="status">Loading scenes.</p>
  </div>
  <p class="credit" id="credit"></p>
  <div class="panel">
    <div class="clock" aria-live="polite">
      <span class="time" id="time"></span>
      <span class="day" id="day"></span>
    </div>
    <div class="actions">
      <span class="count" id="count"></span>
      <div class="steps">
        <button type="button" id="prev" disabled>Previous</button>
        <button type="button" class="random" id="random" disabled>Random</button>
        <button type="button" id="next" disabled>Next</button>
      </div>
    </div>
  </div>
  <p class="hint">Keys: left and right arrows for Previous and Next, space bar or R for Random.</p>
</main>

<script type="module">
import { filterScenes, createDeck, formatTime } from "./picker.js";

const el = (id) => document.getElementById(id);
const photo = el("photo"), message = el("message"), credit = el("credit");
const timeEl = el("time"), dayEl = el("day"), countEl = el("count");
const nextBtn = el("next"), prevBtn = el("prev"), randBtn = el("random"), typeSel = el("type");
const TYPE_ORDER = ["residential", "multi-family", "commercial", "high-rise", "vegetation", "vehicle"];

const TYPE_NAMES = {
  "residential": "residential", "multi-family": "multi-family", "commercial": "commercial",
  "high-rise": "high-rise", "vegetation": "vegetation", "vehicle": "vehicle"
};

let scenes = [];
let pool = [];
let deck = null;
let current = -1;

function say(text) {
  photo.hidden = true;
  message.hidden = false;
  message.textContent = text;
}

function clearClock() {
  timeEl.textContent = "";
  dayEl.textContent = "";
  countEl.textContent = "";
  credit.textContent = "";
}

function show(scene) {
  message.hidden = true;
  photo.hidden = false;
  photo.alt = "Fire scene, " + (TYPE_NAMES[scene.type] || "scene") + ", " + formatTime(scene.time) + " " + scene.day;
  photo.src = scene.file;
  timeEl.textContent = formatTime(scene.time);
  dayEl.textContent = scene.day;
  countEl.textContent = "Scene " + (current + 1) + " of " + pool.length;
  credit.textContent = scene.id.toUpperCase() + (scene.credit ? ". Photo: " + scene.credit : "");
}

function go(i) {
  if (!pool.length) return;
  current = (i + pool.length) % pool.length;
  show(pool[current]);
}
const next = () => go(current + 1);
const prev = () => go(current - 1);
function random() {
  if (!pool.length) return;
  let i = deck.next();
  if (pool.length > 1 && i === current) i = deck.next();
  go(i);
}

function deal() {
  pool = filterScenes(scenes, typeSel.value)
    .sort((a, b) => TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type) || a.id.localeCompare(b.id));
  deck = createDeck(pool.map((_, i) => i));
  current = -1;
  for (const b of [nextBtn, prevBtn, randBtn]) b.disabled = pool.length === 0;
  if (pool.length === 0) {
    clearClock();
    say("No scenes of this type yet. Pick another scene type.");
    return;
  }
  random();
}

photo.addEventListener("error", () => {
  say("This picture could not be loaded. Try the next scene.");
});

nextBtn.addEventListener("click", next);
prevBtn.addEventListener("click", prev);
randBtn.addEventListener("click", random);

typeSel.addEventListener("change", () => {
  try { localStorage.setItem("sceneType", typeSel.value); } catch (e) { /* storage is optional */ }
  deal();
});

document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const tag = event.target.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  // A focused button already acts on space, so only take the arrows and R there.
  if (tag === "BUTTON" && event.key === " ") return;
  if (event.key === "ArrowRight") { event.preventDefault(); next(); }
  else if (event.key === "ArrowLeft") { event.preventDefault(); prev(); }
  else if (event.key === " " || event.key === "r" || event.key === "R") { event.preventDefault(); random(); }
});

try {
  const saved = localStorage.getItem("sceneType");
  if (saved && [...typeSel.options].some((o) => o.value === saved)) typeSel.value = saved;
} catch (e) { /* storage is optional */ }

fetch("scenes.json", { cache: "no-cache" })
  .then((response) => {
    if (!response.ok) throw new Error("scenes");
    return response.json();
  })
  .then((list) => {
    scenes = list;
    deal();
  })
  .catch(() => {
    clearClock();
    say("The scene list could not be loaded. Check your connection and reload the page.");
  });
</script>
</body>
</html>
