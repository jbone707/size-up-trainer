name: fetch-candidates
on:
  push:
    branches: [main]
    paths:
      - scripts/candidate-queries.txt
      - scripts/fetch-candidates.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-candidates.mjs
      - name: Commit candidates to their own branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan candidates
          git rm -rq --cached .
          git add candidates
          git commit -qm "Candidate photos from Wikimedia Commons"
          git push -f origin candidates
