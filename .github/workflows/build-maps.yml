name: build-maps
on:
  push:
    branches: [main]
    paths:
      - data/stations.json
      - data/areas.json
      - scripts/build_maps.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_maps.py
      - name: Commit the rebuilt maps to main
        run: |
          rm -f maps/geocode-report.json.keep
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add maps
          if git diff --cached --quiet; then echo "maps unchanged"; exit 0; fi
          git commit -qm "Rebuilt maps"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
